name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Julia ${{ matrix.version }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        #  long-term support, current release
        version: ['lts', '1']
        #  macos-latest: Apple silicon (arm64, without SME2: variant neon);
        #  ubuntu-latest: x86-64 (variants as the CPU of the runner allows)
        os: [ubuntu-latest, macos-latest]
        #  the oldest supported version; Julia 1.9 does not start on
        #  ubuntu-latest (its libopenlibm requests an executable stack,
        #  which newer versions of glibc refuse)
        include:
          - version: '1.9'
            os: ubuntu-22.04
          - version: '1.9'
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      #  the libraries of ulmBLAS come from the artifact (Artifacts.toml),
      #  not from ULMBLAS_LIBRARY; the tests also run every variant the CPU
      #  can run and the LAPACK, triangular, dense and symmetric tests of
      #  LinearAlgebra
      - uses: julia-actions/julia-runtest@v1
        env:
          ULMBLAS_TEST_LINALG: '1'

  #  the oldest Linux distributions supported (glibc 2.28 and 2.31): the
  #  Linux libraries are built for glibc 2.28 (build/linux-container.sh)
  old-glibc:
    name: Julia ${{ matrix.version }}, ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.9', '1']
        image: ['almalinux:8', 'ubuntu:20.04']
    steps:
      - name: tools
        run: |
          if command -v dnf > /dev/null; then
              dnf install -y -q git tar gzip
          else
              apt-get update -qq && apt-get install -y -qq git curl ca-certificates
          fi
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
