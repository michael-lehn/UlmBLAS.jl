#  Tags and GitHub releases for versions registered in General
#  (https://github.com/JuliaRegistries/TagBot)
name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        description: "[DEPRECATED] No longer has any effect"
        default: "3"
permissions:
  contents: write
  issues: read
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@87cc4cc2b4639f6c743f5772f376a32914060732 # v1.25.15
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          #  a deploy key: tags also for commits that modify workflow files
          ssh: ${{ secrets.DOCUMENTER_KEY }}
