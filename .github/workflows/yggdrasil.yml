#  Builds the Yggdrasil recipe yggdrasil/U/ulmBLAS/build_tarballs.jl with
#  the BinaryBuilder environment of Yggdrasil (.ci/bb1_project) before it is
#  submitted, and uploads the tarballs for testing.
name: yggdrasil

on:
  push:
    branches: [yggdrasil-recipe]
  workflow_dispatch:
    inputs:
      gcc:
        description: 'GCC versions to try for x86_64-linux-gnu (JSON list); empty: normal build'
        default: ''
      crt_platforms:
        description: 'experiment: LLVMCompilerRT 20 for these platforms (JSON list)'
        default: ''
      crt:
        description: 'experiment: LLVMCompilerRT 20 and the recipe linking it'
        type: boolean
        default: false
      crt_file:
        description: 'with crt_platforms: the LLVMCompilerRT recipe in .github/experiments/LLVMCompilerRT'
        type: boolean
        default: false
      crt_consumers:
        description: 'experiment: recipes without a version bound on LLVMCompilerRT, built with 17.0.6 and 20.1.8'
        type: boolean
        default: false

jobs:
  build:
    if: inputs.gcc == '' && !inputs.crt && inputs.crt_platforms == '' && !inputs.crt_consumers
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x86_64-linux-gnu, aarch64-apple-darwin]
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
        with:
          path: pkg
      - uses: actions/checkout@v7
        with:
          repository: JuliaPackaging/Yggdrasil
          ref: 85d4372420a4ae8f5ebc4426b000ce0b513478de
          path: ygg
          sparse-checkout: .ci/bb1_project
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: build
        env:
          BINARYBUILDER_AUTOMATIC_APPLE: 'true'
          BINARYBUILDER_RUNNER: userns
        run: |
          julia --project=ygg/.ci/bb1_project -e 'using Pkg; Pkg.instantiate()'
          cp -R pkg/yggdrasil/U ygg/
          cd ygg/U/ulmBLAS
          julia --project=$GITHUB_WORKSPACE/ygg/.ci/bb1_project build_tarballs.jl --verbose ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: ulmBLAS-${{ matrix.platform }}
          path: ygg/U/ulmBLAS/products

  gcc:
    if: inputs.gcc != ''
    name: gcc ${{ matrix.gcc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gcc: ${{ fromJSON(inputs.gcc) }}
    steps:
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
        with:
          path: pkg
      - uses: actions/checkout@v7
        with:
          repository: JuliaPackaging/Yggdrasil
          ref: 85d4372420a4ae8f5ebc4426b000ce0b513478de
          path: ygg
          sparse-checkout: .ci/bb1_project
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: build
        env:
          BINARYBUILDER_RUNNER: userns
        run: |
          julia --project=ygg/.ci/bb1_project -e 'using Pkg; Pkg.instantiate()'
          cp -R pkg/yggdrasil/U ygg/
          cd ygg/U/ulmBLAS
          sed -i 's/preferred_gcc_version=v"14"/preferred_gcc_version=v"${{ matrix.gcc }}"/' build_tarballs.jl
          grep -n preferred_gcc_version build_tarballs.jl
          julia --project=$GITHUB_WORKSPACE/ygg/.ci/bb1_project build_tarballs.jl --verbose x86_64-linux-gnu
      - name: symbols
        run: |
          cd ygg/U/ulmBLAS/products && mkdir x && tar -xzf ulmBLAS.v*.tar.gz -C x
          for f in x/lib/libulmblas_*.so; do
            echo "$f: $(nm -D --defined-only $f | grep -c '_64_$') _64_, $(nm -D --defined-only $f | grep -c gemm_strided) strided, GLIBCXX $(objdump -T $f | grep -c GLIBCXX)"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ulmBLAS-gcc${{ matrix.gcc }}
          path: ygg/U/ulmBLAS/products

  crt:
    if: inputs.crt
    runs-on: ubuntu-latest
    steps:
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
        with:
          path: pkg
      - uses: actions/checkout@v7
        with:
          repository: JuliaPackaging/Yggdrasil
          ref: 85d4372420a4ae8f5ebc4426b000ce0b513478de
          path: ygg
          sparse-checkout: |
            .ci/bb1_project
            L/LLVMCompilerRT
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: build
        env:
          BINARYBUILDER_AUTOMATIC_APPLE: 'true'
          BINARYBUILDER_RUNNER: userns
        run: |
          julia --project=ygg/.ci/bb1_project -e 'using Pkg; Pkg.instantiate()'
          cp -R pkg/yggdrasil/U ygg/
          bash pkg/.github/experiments/crt.sh
      - name: symbols
        if: always()
        run: |
          sudo apt-get install -y -qq llvm >/dev/null
          for a in $(find out/crt -name 'libclang_rt.osx.a'); do echo "$a"; llvm-nm $a 2>/dev/null | grep -E '__arm_(tpidr2|za_|sme_state|get_current)' ; done
          for f in out/ulm/lib/*.dylib; do echo "$f"; llvm-nm -m $f | grep -E '__arm_|ugemm_32x16_streaming' | head; llvm-nm -gU $f | grep -c '_64_$'; done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crt-experiment
          path: out

  crt-platforms:
    if: inputs.crt_platforms != ''
    name: crt ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.crt_platforms) }}
    steps:
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
        with:
          path: pkg
      - uses: actions/checkout@v7
        with:
          repository: JuliaPackaging/Yggdrasil
          ref: 85d4372420a4ae8f5ebc4426b000ce0b513478de
          path: ygg
          sparse-checkout: |
            .ci/bb1_project
            L/LLVMCompilerRT
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: build
        env:
          BINARYBUILDER_AUTOMATIC_APPLE: 'true'
          BINARYBUILDER_RUNNER: userns
        run: |
          julia --project=ygg/.ci/bb1_project -e 'using Pkg; Pkg.instantiate()'
          CRT_FILE=${{ inputs.crt_file && '1' || '' }} CRT_MUSL_NO_SANITIZERS=1 bash pkg/.github/experiments/crt-platform.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crt-${{ matrix.platform }}
          path: out

  crt-consumers:
    if: inputs.crt_consumers
    name: ${{ matrix.target }} crt ${{ matrix.crt }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crt: ['17', '20']
        target:
          - B/BART aarch64-apple-darwin aarch64-apple-darwin
          - F/Fastscapelib aarch64-apple-darwin-libgfortran5 aarch64-apple-darwin
          - P/PhreeqcRM aarch64-apple-darwin-libgfortran5 aarch64-apple-darwin
          - C/CLAPHost aarch64-apple-darwin aarch64-apple-darwin
          - C/CLAPHost x86_64-apple-darwin x86_64-apple-darwin
          - L/LV2Host aarch64-apple-darwin aarch64-apple-darwin
          - L/LV2Host x86_64-apple-darwin x86_64-apple-darwin
          - T/Tk aarch64-apple-darwin aarch64-apple-darwin
          - T/Tk x86_64-apple-darwin x86_64-apple-darwin
          - L/LibStdCxx x86_64-linux-gnu-sanitize+memory x86_64-linux-gnu
    steps:
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
        with:
          path: pkg
      - uses: actions/checkout@v7
        with:
          repository: JuliaPackaging/Yggdrasil
          ref: f54922238f5f5cbcb5fd937af7527f513cedeb28
          path: ygg
          sparse-checkout: |
            .ci/bb1_project
            0_RootFS
            platforms
            L/LLVMCompilerRT
            B/BART
            F/Fastscapelib
            P/PhreeqcRM
            C/CLAPHost
            L/LV2Host
            T/Tk
            L/LibStdCxx
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: build
        env:
          BINARYBUILDER_AUTOMATIC_APPLE: 'true'
          BINARYBUILDER_RUNNER: userns
        run: |
          julia --project=ygg/.ci/bb1_project -e 'using Pkg; Pkg.instantiate()'
          bash pkg/.github/experiments/crt-consumer.sh ${{ matrix.target }} ${{ matrix.crt }}
