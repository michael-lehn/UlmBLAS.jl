#  Builds the Yggdrasil recipe yggdrasil/U/ulmBLAS/build_tarballs.jl with
#  the BinaryBuilder environment of Yggdrasil (.ci/bb1_project) before it is
#  submitted, and uploads the tarballs for testing.
name: yggdrasil

on:
  push:
    branches: [yggdrasil-recipe]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x86_64-linux-gnu, aarch64-apple-darwin]
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
        with:
          path: pkg
      - uses: actions/checkout@v7
        with:
          repository: JuliaPackaging/Yggdrasil
          ref: 85d4372420a4ae8f5ebc4426b000ce0b513478de
          path: ygg
          sparse-checkout: .ci/bb1_project
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: build
        env:
          BINARYBUILDER_AUTOMATIC_APPLE: 'true'
          BINARYBUILDER_RUNNER: userns
        run: |
          julia --project=ygg/.ci/bb1_project -e 'using Pkg; Pkg.instantiate()'
          cp -R pkg/yggdrasil/U ygg/
          cd ygg/U/ulmBLAS
          julia --project=$GITHUB_WORKSPACE/ygg/.ci/bb1_project build_tarballs.jl --verbose ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: ulmBLAS-${{ matrix.platform }}
          path: ygg/U/ulmBLAS/products
