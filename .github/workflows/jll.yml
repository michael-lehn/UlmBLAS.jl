#  The complete test suite with the libraries of ulmBLAS_jll: the recipe
#  .github/jll-test/ulmBLAS (the one to be submitted to Yggdrasil) is built
#  with Yggdrasil's BinaryBuilder environment, ulmBLAS_jll is generated
#  from the tarballs as Yggdrasil does, and the package (loading the
#  libraries from ulmBLAS_jll) is tested with it on Apple M1 (GitHub's arm64
#  macOS runners) and x86-64 Linux.  Development branch only.
#
#  LLVMCompilerRT_jll 20.1.8 is not registered yet (Yggdrasil's build of the
#  merged recipe failed on aarch64-apple-darwin, see job crt): it is built and
#  generated here from .github/jll-test/LLVMCompilerRT and used from a local git
#  repository; apart from this the recipe is the one for Yggdrasil.
name: jll

on:
  push:
    branches: [jll-release, jll-sme]
  workflow_dispatch:

jobs:
  crt:
    name: LLVMCompilerRT_jll
    runs-on: ubuntu-latest
    steps:
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
        with:
          path: pkg
      - uses: actions/checkout@v7
        with:
          repository: JuliaPackaging/Yggdrasil
          ref: 8017adef5546eae34215051db39d6076de77a18e
          path: ygg
          sparse-checkout: .ci/bb1_project
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: build
        env:
          BINARYBUILDER_AUTOMATIC_APPLE: 'true'
          BINARYBUILDER_RUNNER: userns
        run: |
          julia --project=ygg/.ci/bb1_project -e 'using Pkg; Pkg.instantiate()'
          mkdir -p ygg/L/LLVMCompilerRT
          cp pkg/.github/jll-test/LLVMCompilerRT/build_tarballs.jl ygg/L/LLVMCompilerRT/
          cd ygg/L/LLVMCompilerRT
          P=$GITHUB_WORKSPACE/ygg/.ci/bb1_project
          T=aarch64-apple-darwin
          julia --project=$P build_tarballs.jl --meta-json=$GITHUB_WORKSPACE/meta.json $T
          julia --project=$P build_tarballs.jl --verbose $T 2>&1 | tee $GITHUB_WORKSPACE/crt.log
          test ${PIPESTATUS[0]} = 0
          #  no helper is generated twice: the race cannot happen
          n=$(grep -c 'Generating outline_atomic_helpers.dir/outline_atomic_swp1_1.S' $GITHUB_WORKSPACE/crt.log)
          echo "outline_atomic_swp1_1.S generated $n time(s)"
          test "$n" = 1
          mkdir -p $GITHUB_WORKSPACE/stage
          cp products/LLVMCompilerRT.v*.$T.tar.gz $GITHUB_WORKSPACE/stage/
          sha256sum $GITHUB_WORKSPACE/stage/*
      - name: LLVMCompilerRT_jll
        run: |
          julia --project=ygg/.ci/bb1_project \
              pkg/.github/jll-test/gen_jll.jl meta.json stage file:///tmp/crt-jll
          cp -R ~/.julia/dev/LLVMCompilerRT_jll stage/
          cd stage/LLVMCompilerRT_jll
          rm -rf .git
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm LLVMCompilerRT_jll
          cat Project.toml Artifacts.toml
      - uses: actions/upload-artifact@v7
        with:
          name: LLVMCompilerRT_jll
          path: stage
          include-hidden-files: true

  build:
    needs: crt
    name: build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [x86_64-linux-gnu, aarch64-apple-darwin]
    steps:
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
        with:
          path: pkg
      #  the commit of Yggdrasil the recipe is based on
      - uses: actions/checkout@v7
        with:
          repository: JuliaPackaging/Yggdrasil
          ref: 8017adef5546eae34215051db39d6076de77a18e
          path: ygg
          sparse-checkout: .ci/bb1_project
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: actions/download-artifact@v7
        with:
          name: LLVMCompilerRT_jll
          path: /tmp/crt-jll
      - name: recipe
        run: |
          #  the recipe of the Yggdrasil PR branch ulmBLAS-0.2.0
          echo "c348f13ae557315863d8dd93eb79d75d4633913cf6e92cd6b6e2944ed744427b  pkg/.github/jll-test/ulmBLAS/build_tarballs.jl" | sha256sum -c
          mkdir -p ygg/U/ulmBLAS
          #  only difference: LLVMCompilerRT_jll from the local repository
          sed 's|name="LLVMCompilerRT_jll", version="20.1.8"|name="LLVMCompilerRT_jll", path="/tmp/crt-jll/LLVMCompilerRT_jll"|' \
              pkg/.github/jll-test/ulmBLAS/build_tarballs.jl > ygg/U/ulmBLAS/build_tarballs.jl
          diff pkg/.github/jll-test/ulmBLAS/build_tarballs.jl ygg/U/ulmBLAS/build_tarballs.jl | grep -c '^>' | grep -qx 1
      - name: build
        env:
          BINARYBUILDER_AUTOMATIC_APPLE: 'true'
          BINARYBUILDER_RUNNER: userns
        run: |
          julia --project=ygg/.ci/bb1_project -e 'using Pkg; Pkg.instantiate()'
          cd ygg/U/ulmBLAS
          P=$GITHUB_WORKSPACE/ygg/.ci/bb1_project
          julia --project=$P build_tarballs.jl --meta-json=$GITHUB_WORKSPACE/meta-${{ matrix.platform }}.json ${{ matrix.platform }}
          julia --project=$P build_tarballs.jl --verbose ${{ matrix.platform }}
          mkdir -p $GITHUB_WORKSPACE/out
          cp products/ulmBLAS.v*.${{ matrix.platform }}.tar.gz $GITHUB_WORKSPACE/meta-${{ matrix.platform }}.json $GITHUB_WORKSPACE/out/
          sha256sum $GITHUB_WORKSPACE/out/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.platform }}
          path: out

  jll:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: pkg
      - uses: actions/checkout@v7
        with:
          repository: JuliaPackaging/Yggdrasil
          ref: 8017adef5546eae34215051db39d6076de77a18e
          path: ygg
          sparse-checkout: .ci/bb1_project
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: actions/download-artifact@v7
        with:
          pattern: tarball-*
          merge-multiple: true
          path: stage
      - name: ulmBLAS_jll
        run: |
          julia --project=ygg/.ci/bb1_project -e 'using Pkg; Pkg.instantiate()'
          cat stage/meta-*.json > meta.json
          rm stage/meta-*.json
          #  download URLs: /tmp/ulmblas-jll on the test runners
          julia --project=ygg/.ci/bb1_project \
              pkg/.github/jll-test/gen_jll.jl meta.json stage file:///tmp/ulmblas-jll
          #  BinaryBuilder writes the package to ~/.julia/dev
          cp -R ~/.julia/dev/ulmBLAS_jll stage/
          sha256sum stage/*.tar.gz
          cat stage/ulmBLAS_jll/Artifacts.toml
      - uses: actions/upload-artifact@v7
        with:
          name: ulmBLAS_jll
          path: stage

  test:
    needs: jll
    name: Julia ${{ matrix.version }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        #  macos-14, macos-latest: arm64 with Apple M1 (step "CPU")
        os: [macos-14, macos-latest, ubuntu-latest]
        version: ['1.9', 'lts', '1']
        exclude:
          #  Julia 1.9 does not start on ubuntu-latest (executable stack)
          - os: ubuntu-latest
            version: '1.9'
        include:
          - os: ubuntu-22.04
            version: '1.9'
    steps:
      - uses: actions/checkout@v7
        with:
          path: pkg
      #  at the path of the download URLs in Artifacts.toml
      - uses: actions/download-artifact@v7
        with:
          name: ulmBLAS_jll
          path: /tmp/ulmblas-jll
      - name: CPU
        run: |
          if [ "$(uname)" = Darwin ]; then
              sysctl -n machdep.cpu.brand_string hw.model
              sysctl hw.optional.arm.FEAT_SME2 hw.optional.arm.FEAT_SME_F64F64 hw.optional.arm.sme_max_svl_b || true
              sw_vers
              shasum -a 256 /tmp/ulmblas-jll/*.tar.gz
          else
              lscpu | grep -E 'Model name|Flags' | cut -c1-400
              sha256sum /tmp/ulmblas-jll/*.tar.gz
          fi
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - name: develop
        run: |
          julia --project=env -e 'using Pkg
              Pkg.develop([PackageSpec(path="/tmp/ulmblas-jll/ulmBLAS_jll"),
                           PackageSpec(path="pkg")])'
      - name: identity
        run: julia --project=env pkg/.github/jll-test/identity.jl
      #  the complete suite, with the LAPACK, triangular, dense and symmetric
      #  tests of LinearAlgebra
      - name: test
        env:
          ULMBLAS_TEST_LINALG: '1'
        run: julia --project=env -e 'using Pkg; Pkg.test("UlmBLAS")'
